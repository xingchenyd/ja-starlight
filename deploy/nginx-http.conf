# Keep credentials off plaintext HTTP while DNS / certificate setup is pending.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name star-plan.com www.star-plan.com;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/star-plan-acme;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 'Star Plan is preparing secure access. Please return shortly.\n';
    }
}
