# Install only after the star-plan.com certificate has been issued and validated.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name star-plan.com www.star-plan.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/star-plan-acme; try_files $uri =404; }
    location / { return 308 https://star-plan.com$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.star-plan.com;
    ssl_certificate /etc/letsencrypt/live/star-plan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/star-plan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://star-plan.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name star-plan.com;
    ssl_certificate /etc/letsencrypt/live/star-plan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/star-plan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 110m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host star-plan.com;
        proxy_set_header X-Forwarded-Host star-plan.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
